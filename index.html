<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171614" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IMPOSTER" />
    <meta name="description" content="Find the imposters." />
    <title>IMPOSTER</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/imposter.svg" />
    <link rel="apple-touch-icon" href="/icons/imposter.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="IMPOSTER home">
        <span class="brand-mark">I</span>
        <span>IMPOSTER</span>
      </a>
      <div class="topbar-actions">
        <span id="authStatus" class="player-name">Connecting…</span>
        <button id="installAppBtn" class="install-button hidden" type="button">INSTALL</button>
      </div>
    </header>

    <main>
      <section id="homeScreen" class="home-screen">
        <h1>Find the imposter.</h1>
        <div class="player-setup">
          <label for="playerNameInput">YOUR NAME</label>
          <input id="playerNameInput" type="text" maxlength="18" placeholder="Enter your name" autocomplete="nickname" required />
          <label for="maxPlayersInput">ROOM SIZE</label>
          <select id="maxPlayersInput">
            <option value="4">4 players</option>
            <option value="6">6 players</option>
            <option value="8" selected>8 players</option>
            <option value="10">10 players</option>
            <option value="12">12 players</option>
            <option value="16">16 players</option>
            <option value="20">20 players</option>
          </select>
        </div>
        <div class="home-actions">
          <button id="createRoomAction" class="button button-primary" type="button">CREATE ROOM</button>
          <form id="joinForm" class="join-form">
            <input id="joinCodeInput" type="text" maxlength="6" placeholder="ROOM CODE" aria-label="Room code" autocomplete="off" />
            <button class="button button-secondary" type="submit">JOIN</button>
          </form>
        </div>
        <p class="hint">Choose a name. 4 players needed to start.</p>
      </section>

      <section id="roomScreen" class="room-screen hidden" aria-live="polite">
        <div class="room-heading">
          <div id="roomMeta" class="room-meta"></div>
          <button id="copyRoomBtn" class="button button-secondary" type="button">INVITE</button>
        </div>

        <div class="game-panel">
          <div id="privateCard" class="identity-card hidden"></div>
          <div id="timerDisplay" class="timer-display">WAITING</div>
          <div class="room-actions">
            <button id="toggleReadyBtn" class="button button-secondary" type="button">READY</button>
            <button id="startGameBtn" class="button button-primary hidden" type="button">START (4+)</button>
            <button id="leaveRoomBtn" class="button button-quiet" type="button">LEAVE</button>
          </div>
        </div>

        <div class="game-columns">
          <section class="panel">
            <h2>PLAYERS <span id="playerCount"></span></h2>
            <div id="playerList" class="player-list"></div>
          </section>
          <section class="panel">
            <h2>CHAT</h2>
            <div id="chatWindow" class="chat-window"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatMessageInput" type="text" maxlength="220" placeholder="Message" aria-label="Message" autocomplete="off" />
              <button id="sendChatBtn" class="button button-primary" type="submit">SEND</button>
            </form>
          </section>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="/socket.io-client.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
